services:
  - type: web
    name: ai-data-scientist-agent
    runtime: python
    plan: 1c-2g
    autoDeploy: false
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn FastAPI_Main_Server:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    disk:
      name: app-data
      mountPath: /opt/render/project/src/storage
      sizeGB: 5
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: APP_DATA_DIR
        value: /opt/render/project/src/storage
      - key: APP_ENV
        value: production
      - key: MAX_UPLOAD_MB
        value: 200
      - key: MAX_TRAIN_ROWS
        value: 15000
      - key: MAX_ANALYSIS_ROWS
        value: 50000
      - key: APP_USERNAME
        sync: false
      - key: APP_PASSWORD
        sync: false
