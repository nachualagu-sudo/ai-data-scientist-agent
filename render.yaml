services:
  - type: web
    name: ai-data-scientist-agent
    runtime: python
    plan: free
    autoDeploy: false
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn FastAPI_Main_Server:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: APP_ENV
        value: production
      - key: MAX_UPLOAD_MB
        value: 10
      - key: MAX_TRAIN_ROWS
        value: 3000
      - key: MAX_ANALYSIS_ROWS
        value: 10000
      - key: MAX_COLUMNS
        value: 30
      - key: MAX_EXCEL_EXPANDED_MB
        value: 30
      - key: APP_USERNAME
        sync: false
      - key: APP_PASSWORD
        sync: false
